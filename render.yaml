# Publicacao no Render (plano gratuito): New -> Blueprint -> este repositorio.
# O banco e o Render Postgres gratuito (cadeira-db). A URL do banco e ligada automaticamente.
# Sem Resend e sem Asaas o site sobe em fase de lancamento (e-mail e cobranca online desligados).
databases:
  - name: cadeira-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
services:
  - type: web
    name: cadeira
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cadeira-db
          property: connectionString
      # rede interna do Render: o banco usa certificado proprio, sem SSL publico
      - key: DATABASE_SSL
        value: "0"
      - key: PUBLIC_HOST
        value: cadeira.onrender.com
      - key: SUPPORT_EMAIL
        value: gustavosousamelx@gmail.com
      - key: ADMIN_EMAIL
        value: gustavosousamelx@gmail.com